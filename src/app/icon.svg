<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Circle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf2f8" />
      <stop offset="100%" stop-color="#fce7f3" />
    </linearGradient>

    <!-- Flower Petal Main Gradient -->
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Center Core Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#fda4af" />
    </linearGradient>

    <!-- Golden Stamen Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#be185d" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Circle (Soft Pastel) -->
  <circle cx="50" cy="50" r="46" fill="url(#bgGrad)" stroke="#fbcfe8" stroke-width="2" />

  <!-- Botanical Leaves at bottom -->
  <path d="M50 68 C40 82 25 76 28 64 C35 60 45 62 50 68 Z" fill="url(#leafGrad)" opacity="0.9" />
  <path d="M50 68 C60 82 75 76 72 64 C65 60 55 62 50 68 Z" fill="url(#leafGrad)" opacity="0.9" />

  <!-- Outer Petals (Bloom) -->
  <g filter="url(#shadow)">
    <!-- Top Petal -->
    <path d="M50 20 C42 32 45 46 50 50 C55 46 58 32 50 20 Z" fill="url(#petalGrad)" />
    <!-- Top-Right Petal -->
    <path d="M68 28 C56 36 52 48 50 50 C56 52 68 44 68 28 Z" fill="url(#petalGrad)" opacity="0.95" />
    <!-- Right Petal -->
    <path d="M78 48 C66 48 56 52 50 50 C54 58 68 62 78 48 Z" fill="url(#petalGrad)" opacity="0.9" />
    <!-- Bottom-Right Petal -->
    <path d="M66 70 C58 60 52 54 50 50 C48 58 56 68 66 70 Z" fill="url(#petalGrad)" opacity="0.85" />
    <!-- Bottom-Left Petal -->
    <path d="M34 70 C42 60 48 54 50 50 C52 58 44 68 34 70 Z" fill="url(#petalGrad)" opacity="0.85" />
    <!-- Left Petal -->
    <path d="M22 48 C34 48 44 52 50 50 C46 58 32 62 22 48 Z" fill="url(#petalGrad)" opacity="0.9" />
    <!-- Top-Left Petal -->
    <path d="M32 28 C44 36 48 48 50 50 C44 52 32 44 32 28 Z" fill="url(#petalGrad)" opacity="0.95" />
  </g>

  <!-- Inner Soft Rose Core -->
  <circle cx="50" cy="50" r="14" fill="url(#coreGrad)" />
  <path d="M44 48 C46 42 54 42 56 48 C56 54 48 56 46 52" fill="none" stroke="#be123c" stroke-width="2.5" stroke-linecap="round" />
  <path d="M47 53 C49 56 53 56 54 53" fill="none" stroke="#be123c" stroke-width="2" stroke-linecap="round" />

  <!-- Center Golden Stamen Glimmer -->
  <circle cx="50" cy="49" r="3.5" fill="url(#goldGrad)" />
  <circle cx="46" cy="45" r="1.5" fill="#fef08a" />
  <circle cx="54" cy="45" r="1.5" fill="#fef08a" />
</svg>
